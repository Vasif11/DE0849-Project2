# Scenario A TLS application gateway.
#   HTTP :80  -> 301 redirect to HTTPS
#   HTTPS :443 -> TLS termination (TLS 1.2 / 1.3), reverse proxy to Django on app-net

upstream django_app {
    server 10.20.8.20:8000;
}

server {
    listen 80;
    server_name 10.20.6.20 telecom-lab.local localhost;

    # health endpoint stays reachable over HTTP for Docker/CI probes
    location = /gateway-health { default_type text/plain; return 200 "nginx-gateway ok\n"; }

    # everything else: permanent redirect to HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 10.20.6.20 telecom-lab.local localhost;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # Django recognises the client request as HTTPS
    }
}
